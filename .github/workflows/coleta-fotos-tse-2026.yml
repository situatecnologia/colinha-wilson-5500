name: Coleta fotos Deputado Estadual PI 2026

on:
  push:
    branches:
      - coleta-fotos-tse-2026
    paths:
      - '.github/workflows/coleta-fotos-tse-2026.yml'

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Coletar fotos oficiais do TSE via espelho eleitoral
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import html as htmllib
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          SITE = 'https://resultadoseleicoes.com'
          LIST_BASE = SITE + '/eleicoes/2026/pi/deputado-estadual'
          OUT = Path('Fotos_Deputado_Estadual_PI_2026')
          OUT.mkdir(exist_ok=True)

          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language': 'pt-BR,pt;q=0.9,en;q=0.8',
          }

          def fetch(url, accept='text/html,*/*;q=0.8', retries=4):
              headers = dict(HEADERS)
              headers['Accept'] = accept
              last = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return r.read(), dict(r.headers), r.geturl()
                  except Exception as e:
                      last = e
                      print(f'Tentativa {attempt+1}/{retries} falhou: {url} -> {e}')
                      time.sleep(1.5 * (attempt + 1))
              raise last

          # O portal informa 151 candidaturas e pagina em 3 páginas.
          listing_urls = [LIST_BASE, LIST_BASE + '/pagina/2', LIST_BASE + '/pagina/3']
          profile_paths = []
          for url in listing_urls:
              raw, _, _ = fetch(url)
              text = raw.decode('utf-8', errors='replace')
              links = re.findall(r'href="(/eleicoes/2026/candidatos/[^"]+)"', text)
              print(url, 'links encontrados:', len(links))
              profile_paths.extend(links)

          # Deduplicação preservando a ordem alfabética apresentada pelo portal.
          seen = set()
          profiles = []
          for p in profile_paths:
              p = htmllib.unescape(p)
              if p not in seen:
                  seen.add(p)
                  profiles.append(p)

          print('Perfis únicos encontrados:', len(profiles))
          if len(profiles) < 140:
              raise SystemExit(f'Quantidade de perfis inesperadamente baixa: {len(profiles)}')

          manifest = []
          numeros_usados = set()

          for idx, path in enumerate(profiles, 1):
              profile_url = urllib.parse.urljoin(SITE, path)
              cid = path.split('/candidatos/', 1)[1].split('-', 1)[0]
              status = 'OK'
              erro = ''
              numero = ''
              nome = ''
              foto_url = ''
              arquivo = ''

              try:
                  raw, _, _ = fetch(profile_url)
                  text = raw.decode('utf-8', errors='replace')

                  title_match = re.search(r'<title>(.*?)</title>', text, flags=re.I|re.S)
                  title = htmllib.unescape(re.sub(r'<[^>]+>', '', title_match.group(1))).strip() if title_match else ''
                  m = re.match(r'(.+?)\s*\((\d{5})\)\s*[—-]', title)
                  if not m:
                      # Fallback no texto próximo ao h1.
                      h1 = re.search(r'<h1[^>]*>(.*?)</h1>', text, flags=re.I|re.S)
                      nome = htmllib.unescape(re.sub(r'<[^>]+>', '', h1.group(1))).strip() if h1 else ''
                      body_plain = htmllib.unescape(re.sub(r'<[^>]+>', ' ', text))
                      n = re.search(r'\b(\d{5})\b', body_plain)
                      if not n:
                          raise ValueError('Número eleitoral não localizado no perfil')
                      numero = n.group(1)
                  else:
                      nome = m.group(1).strip()
                      numero = m.group(2)

                  if numero in numeros_usados:
                      raise ValueError(f'Número duplicado detectado: {numero}')
                  numeros_usados.add(numero)

                  img_match = re.search(r'<img[^>]+class="[^"]*foto--destaque[^"]*"[^>]+src="([^"]+)"', text, flags=re.I)
                  if not img_match:
                      img_match = re.search(r'<img[^>]+src="([^"]*/fotos/[^"]+\.jpg[^\"]*)"[^>]+alt="Foto oficial', text, flags=re.I)
                  src = htmllib.unescape(img_match.group(1)) if img_match else f'/fotos/{cid}.jpg'
                  foto_url = urllib.parse.urljoin(SITE, src)

                  img, hdr, resolved = fetch(foto_url, accept='image/jpeg,image/*;q=0.9,*/*;q=0.5')
                  ctype = (hdr.get('Content-Type') or hdr.get('content-type') or '').lower()
                  if len(img) < 500 or (ctype and 'image' not in ctype):
                      raise ValueError(f'Arquivo de foto inválido: {ctype}, {len(img)} bytes')

                  arquivo = f'{numero}.jpg'
                  (OUT / arquivo).write_bytes(img)

              except Exception as e:
                  status = 'ERRO'
                  erro = repr(e)

              manifest.append({
                  'NR_CANDIDATO': numero,
                  'NM_URNA_CANDIDATO': nome,
                  'ID_PORTAL': cid,
                  'ARQUIVO_RENOMEADO': arquivo,
                  'FOTO_URL': foto_url,
                  'PERFIL_URL': profile_url,
                  'STATUS': status,
                  'ERRO': erro,
              })
              print(f'[{idx:03d}/{len(profiles)}] {numero or "?????"} - {nome or path}: {status}')

          manifest.sort(key=lambda x: (int(x['NR_CANDIDATO']) if x['NR_CANDIDATO'].isdigit() else 999999, x['NM_URNA_CANDIDATO']))
          fields = ['NR_CANDIDATO','NM_URNA_CANDIDATO','ID_PORTAL','ARQUIVO_RENOMEADO','FOTO_URL','PERFIL_URL','STATUS','ERRO']
          with open(OUT / 'manifesto.csv', 'w', encoding='utf-8-sig', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields, delimiter=';')
              w.writeheader()
              w.writerows(manifest)

          ok = [x for x in manifest if x['STATUS'] == 'OK']
          faltas = [x for x in manifest if x['STATUS'] != 'OK']
          with open(OUT / 'RESUMO.txt', 'w', encoding='utf-8') as f:
              f.write('Deputado Estadual - Piauí - Eleições 2026\n')
              f.write('Fotos oficiais publicadas pelo TSE, reproduzidas pelo Portal Eleições 2026.\n')
              f.write('O TSE bloqueou acesso automatizado por IP de datacenter (HTTP 403), por isso a coleta usa o espelho que identifica cada imagem como foto oficial publicada pelo TSE.\n\n')
              f.write(f'Perfis encontrados: {len(manifest)}\n')
              f.write(f'Fotos baixadas e renomeadas pelo número: {len(ok)}\n')
              f.write(f'Pendências: {len(faltas)}\n')
              if faltas:
                  f.write('\nPendências:\n')
                  for x in faltas:
                      f.write(f"{x['NR_CANDIDATO'] or 'SEM_NUMERO'} - {x['NM_URNA_CANDIDATO'] or x['PERFIL_URL']} - {x['ERRO']}\n")

          print('RESULTADO FINAL -> perfis:', len(manifest), 'fotos OK:', len(ok), 'pendências:', len(faltas))
          if len(ok) < 140:
              raise SystemExit(f'Quantidade de fotos baixadas inesperadamente baixa: {len(ok)}')
          PY

      - name: Validar e compactar
        shell: bash
        run: |
          echo "JPGs:" $(find Fotos_Deputado_Estadual_PI_2026 -maxdepth 1 -type f -name '*.jpg' | wc -l)
          cat Fotos_Deputado_Estadual_PI_2026/RESUMO.txt
          zip -r Fotos_Deputado_Estadual_PI_2026.zip Fotos_Deputado_Estadual_PI_2026

      - name: Publicar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Fotos_Deputado_Estadual_PI_2026
          path: Fotos_Deputado_Estadual_PI_2026.zip
          if-no-files-found: error
          retention-days: 7
